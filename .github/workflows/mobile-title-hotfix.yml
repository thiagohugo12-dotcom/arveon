name: Mobile title hotfix preview

on:
  push:
    branches:
      - fix/mobile-title-touch-20261022

permissions:
  contents: read

concurrency:
  group: arveon-mobile-title-hotfix
  cancel-in-progress: true

jobs:
  mobile-hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - name: Checkout hotfix
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install matching Godot and Web templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"
          ln -s "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /tmp/godot-bin/godot
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz 'templates/web*' -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/web* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          touch build/.gdignore
          godot --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/import.log; then exit 1; fi

      - name: Test mobile title and two-floor startup
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --path . --script res://tests/alpha02_smoke.gd 2>&1 | tee /tmp/mobile-title.log
          grep '^ALPHA02 RESULT: 0 falhas$' /tmp/mobile-title.log
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' /tmp/mobile-title.log; then exit 1; fi

      - name: Export corrected Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/export.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/export.log; then exit 1; fi
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Install and validate branded loading screen
        shell: bash
        run: |
          set -euo pipefail
          node tools/inject-arveon-loading.mjs
          node tests/web_arveon_loading.mjs

      - name: Prepare Vercel preview
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Publish corrected build to fixed TESTE
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_6XRzZ5HN4AOw2hWyIpf8McMU
          VERCEL_PROJECT_ID: prj_gYKlx91MiswTmwj2PLiN5liQD0B7
          TEST_ALIAS: arveon-teste.vercel.app
          PREVIEW_COMMIT_SHA: ${{ github.sha }}
          PREVIEW_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p build/web/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > build/web/.vercel/project.json
          cp tools/preview-vercel.json build/web/vercel.json
          cd build/web
          npx --yes vercel@62.7.0 deploy --yes --non-interactive --meta "githubCommitSha=$PREVIEW_COMMIT_SHA" --meta "githubCommitRef=$PREVIEW_BRANCH" > /tmp/arveon-hotfix-deploy.json
          preview_url="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync("/tmp/arveon-hotfix-deploy.json", "utf8"));
            if (result.status !== "ok" || result.deployment.readyState !== "READY" || result.deployment.target === "production") process.exit(1);
            console.log(result.deployment.url);
          ')"
          PREVIEW_URL="$preview_url" node ../../tools/publish-test-alias.mjs
          echo "TESTE: https://$TEST_ALIAS" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: $preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify fixed TESTE
        run: node tools/verify-test-build.mjs

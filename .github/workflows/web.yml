name: Web build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install matching engine and export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"
          ln -s "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /tmp/godot-bin/godot
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz 'templates/web*' -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/web* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          touch build/.gdignore
          godot --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/import.log; then exit 1; fi
      - name: Gameplay contract tests
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 90s godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee /tmp/tests.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/tests.log; then exit 1; fi
          grep -E '^RESULT: [0-9]+ checks, 0 failures$' /tmp/tests.log
          timeout --signal=TERM --kill-after=10s 90s godot --headless --path . --script res://tests/first_weapon_tests.gd 2>&1 | tee /tmp/first-weapon-tests.log
          if grep -E 'SCRIPT ERROR|ERROR:|FIRST_WEAPON_FAIL:' /tmp/first-weapon-tests.log; then exit 1; fi
          grep -E '^FIRST_WEAPON_RESULT: [0-9]+ checks, 0 failures$' /tmp/first-weapon-tests.log
          timeout --signal=TERM --kill-after=10s 90s godot --headless --path . --script res://tests/sword_demo_tests.gd 2>&1 | tee /tmp/sword-tests.log
          if grep -E 'SCRIPT ERROR|ERROR:|SWORD_DEMO_FAIL:' /tmp/sword-tests.log; then exit 1; fi
          grep -E '^SWORD_DEMO_RESULT: [0-9]+ checks, 0 failures$' /tmp/sword-tests.log
          timeout --signal=TERM --kill-after=10s 90s godot --headless --path . --script res://tests/sword_game_tests.gd 2>&1 | tee /tmp/sword-game-tests.log
          if grep -E 'SCRIPT ERROR|ERROR:|SWORD_GAME_FAIL:' /tmp/sword-game-tests.log; then exit 1; fi
          grep -E '^SWORD_GAME_RESULT: [0-9]+ checks, 0 failures$' /tmp/sword-game-tests.log
          timeout --signal=TERM --kill-after=10s 90s godot --headless --path . --script res://tests/bow_demo_tests.gd 2>&1 | tee /tmp/bow-tests.log
          if grep -E 'SCRIPT ERROR|ERROR:|BOW_DEMO_FAIL:' /tmp/bow-tests.log; then exit 1; fi
          grep -E '^BOW_DEMO_RESULT: [0-9]+ checks, 0 failures$' /tmp/bow-tests.log
          timeout --signal=TERM --kill-after=10s 90s godot --headless --path . --script res://tests/bow_game_tests.gd 2>&1 | tee /tmp/bow-game-tests.log
          if grep -E 'SCRIPT ERROR|ERROR:|BOW_GAME_FAIL:' /tmp/bow-game-tests.log; then exit 1; fi
          grep -E '^BOW_GAME_RESULT: [0-9]+ checks, 0 failures$' /tmp/bow-game-tests.log
          timeout --signal=TERM --kill-after=10s 90s godot --headless --path . --script res://tests/staff_demo_tests.gd 2>&1 | tee /tmp/staff-tests.log
          if grep -E 'SCRIPT ERROR|ERROR:|STAFF_DEMO_FAIL:' /tmp/staff-tests.log; then exit 1; fi
          grep -E '^STAFF_DEMO_RESULT: [0-9]+ checks, 0 failures$' /tmp/staff-tests.log
          timeout --signal=TERM --kill-after=10s 90s godot --headless --path . --script res://tests/staff_game_tests.gd 2>&1 | tee /tmp/staff-game-tests.log
          if grep -E 'SCRIPT ERROR|ERROR:|STAFF_GAME_FAIL:' /tmp/staff-game-tests.log; then exit 1; fi
          grep -E '^STAFF_GAME_RESULT: [0-9]+ checks, 0 failures$' /tmp/staff-game-tests.log
          timeout --signal=TERM --kill-after=10s 90s godot --headless --path . --script res://tests/melee_demo_tests.gd 2>&1 | tee /tmp/melee-tests.log
          if grep -E 'SCRIPT ERROR|ERROR:|MELEE_DEMO_FAIL:' /tmp/melee-tests.log; then exit 1; fi
          grep -E '^MELEE_DEMO_RESULT: [0-9]+ checks, 0 failures$' /tmp/melee-tests.log
          timeout --signal=TERM --kill-after=10s 90s godot --headless --path . --script res://tests/melee_game_tests.gd 2>&1 | tee /tmp/melee-game-tests.log
          if grep -E 'SCRIPT ERROR|ERROR:|MELEE_GAME_FAIL:' /tmp/melee-game-tests.log; then exit 1; fi
          grep -E '^MELEE_GAME_RESULT: [0-9]+ checks, 0 failures$' /tmp/melee-game-tests.log
          timeout --signal=TERM --kill-after=10s 90s godot --headless --path . --script res://tests/skill1_tests.gd 2>&1 | tee /tmp/skill1-tests.log
          if grep -E 'SCRIPT ERROR|ERROR:|SKILL1_FAIL:' /tmp/skill1-tests.log; then exit 1; fi
          grep -E '^SKILL1_RESULT: [0-9]+ checks, 0 failures$' /tmp/skill1-tests.log
          timeout 90s godot --headless --path . --script res://tests/skill1_inspection_tests.gd 2>&1 | tee /tmp/inspection-tests.log
          if grep -E 'SCRIPT ERROR|ERROR:|INSPECTION_FAIL:' /tmp/inspection-tests.log; then exit 1; fi
          grep -E '^INSPECTION_RESULT: [0-9]+ checks, 0 failures$' /tmp/inspection-tests.log
      - name: Set up Node for save validation
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser journal contracts
        run: node --test tests/browser_save_tests.cjs
      - name: Report startup diagnostics
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/perf_probe.gd 2>&1 | tee /tmp/perf.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/perf.log; then exit 1; fi
          grep '^PERF_PROBE:' /tmp/perf.log
      - name: Render mobile layouts in software GL
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feat/andar1-v020-primeiro-passe'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          mkdir -p build/mobile-qa
          QA_RENDER_DIR="$PWD/build/mobile-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/mobile_capture.gd 2>&1 | tee /tmp/render.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/render.log; then exit 1; fi
          QA_RENDER_DIR="$PWD/build/mobile-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/combat_capture.gd 2>&1 | tee /tmp/combat-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/combat-render.log; then exit 1; fi
          grep '^COMBAT_QA_RESULT: 0 failures$' build/mobile-qa/combat-result.txt
          QA_RENDER_DIR="$PWD/build/mobile-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/tower_capture.gd 2>&1 | tee /tmp/tower-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/tower-render.log; then exit 1; fi
          grep '^TOWER_QA_RESULT: 0 failures$' build/mobile-qa/tower-result.txt
          QA_RENDER_DIR="$PWD/build/mobile-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 90s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/arena_capture.gd 2>&1 | tee /tmp/arena-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/arena-render.log; then exit 1; fi
          grep '^ARENA_QA_RESULT: 0 failures$' build/mobile-qa/arena-result.txt
          QA_RENDER_DIR="$PWD/build/mobile-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/save_capture.gd 2>&1 | tee /tmp/save-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/save-render.log; then exit 1; fi
          grep '^SAVE_QA_RESULT: 0 failures$' build/mobile-qa/save-result.txt
          QA_RENDER_DIR="$PWD/build/mobile-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/guardian_capture.gd 2>&1 | tee /tmp/guardian-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/guardian-render.log; then exit 1; fi
          grep '^GUARDIAN_QA_RESULT: 0 failures$' build/mobile-qa/guardian-result.txt
          QA_RENDER_DIR="$PWD/build/mobile-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 90s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/campaign_capture.gd 2>&1 | tee /tmp/campaign-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/campaign-render.log; then exit 1; fi
          grep '^CAMPAIGN_QA_RESULT: 0 failures$' build/mobile-qa/campaign-result.txt
          QA_RENDER_DIR="$PWD/build/mobile-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 90s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/arsenal_capture.gd 2>&1 | tee /tmp/arsenal-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/arsenal-render.log; then exit 1; fi
          grep '^ARSENAL_QA_RESULT: 0 failures$' build/mobile-qa/arsenal-result.txt
          QA_RENDER_DIR="$PWD/build/mobile-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/mata_capture.gd 2>&1 | tee /tmp/mata-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/mata-render.log; then exit 1; fi
          grep '^MATA_QA_RESULT: 0 failures$' build/mobile-qa/mata-result.txt
          QA_RENDER_DIR="$PWD/build/mobile-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/mata_sample_capture.gd 2>&1 | tee /tmp/sample-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/sample-render.log; then exit 1; fi
          grep '^SAMPLE_RESULT: 19 checks, 0 failures$' /tmp/sample-render.log
          QA_RENDER_DIR="$PWD/build/mobile-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 90s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/mata_v2_capture.gd 2>&1 | tee /tmp/mata-v2-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/mata-v2-render.log; then exit 1; fi
          grep '^MATA_V2_RESULT: 34 checks, 0 failures$' /tmp/mata-v2-render.log
          test "$(find build/mobile-qa -name '*.png' | wc -l)" -eq 233
          QA_RENDER_DIR="$PWD/build/diary-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/diary_capture.gd 2>&1 | tee /tmp/diary-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/diary-render.log; then exit 1; fi
          test "$(find build/diary-qa -name '*.png' | wc -l)" -eq 24
          QA_RENDER_DIR="$PWD/build/progression-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/progression_capture.gd 2>&1 | tee /tmp/progression-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/progression-render.log; then exit 1; fi
          grep '^PROGRESSION_QA_RESULT: 0 failures$' /tmp/progression-render.log
          test "$(find build/progression-qa -name '*.png' | wc -l)" -eq 20
          QA_RENDER_DIR="$PWD/build/etapa2-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 90s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/etapa2_capture.gd 2>&1 | tee /tmp/etapa2-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/etapa2-render.log; then exit 1; fi
          grep '^ETAPA2_RENDER_RESULT: 0 failures$' /tmp/etapa2-render.log
          test "$(find build/etapa2-qa -name '*.png' | wc -l)" -eq 40
          QA_RENDER_DIR="$PWD/build/first-weapon-qa" LIBGL_ALWAYS_SOFTWARE=1 timeout 90s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/first_weapon_tests.gd 2>&1 | tee /tmp/first-weapon-render.log
          if grep -E 'SCRIPT ERROR|ERROR:|FIRST_WEAPON_FAIL:' /tmp/first-weapon-render.log; then exit 1; fi
          grep -E '^FIRST_WEAPON_RESULT: [0-9]+ checks, 0 failures$' /tmp/first-weapon-render.log
          test "$(find build/first-weapon-qa -name '*.png' | wc -l)" -eq 8
      - name: Probe bounded Skill 1 effects in software GL
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feat/andar1-v020-primeiro-passe'
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 timeout 45s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/skill1_perf_probe.gd 2>&1 | tee /tmp/skill1-perf.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/skill1-perf.log; then exit 1; fi
          grep -E '^SKILL1_PERF_RESULT: .*0 failures$' /tmp/skill1-perf.log
      - name: Save rendered layout evidence
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feat/andar1-v020-primeiro-passe'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-qa
          path: |
            build/mobile-qa/
            build/diary-qa/
            build/progression-qa/
            build/etapa2-qa/
            build/first-weapon-qa/
          if-no-files-found: error
          retention-days: 14
      - name: Export Web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/export.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/export.log; then exit 1; fi
          if grep -E 'Storing File: res://build/|Storing File:.*(combat|tower|arena|guardian|campaign|arsenal|mata)_[0-9]+x[0-9]+_|Storing File: res://assets/art/forest_(oak|linden|spruce)_v035.png' /tmp/export.log; then exit 1; fi
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
      - name: Prepare isolated art sample entry
        run: node tools/build-art-sample.mjs
      - name: Prepare isolated sword review entry
        run: node tools/build-sword-demo.mjs
      - name: Prepare isolated bow review entry
        run: node tools/build-bow-demo.mjs
      - name: Prepare isolated staff review entry
        run: node tools/build-staff-demo.mjs
      - name: Prepare isolated axe and spear reviews
        run: node tools/build-melee-demos.mjs
      - name: Prepare isolated Skill 1 review
        run: node tools/build-skill1-demo.mjs
      - name: Verify five Skills 1 in desktop and touch Chromium
        run: timeout 150s node tests/web_skill1_demo.mjs
      - name: Verify axe and spear with desktop and touch Chromium
        run: |
          MELEE_REVIEW_WEAPON=machado timeout 150s node tests/web_melee_demos.mjs
          MELEE_REVIEW_WEAPON=lanca timeout 150s node tests/web_melee_demos.mjs
      - name: Verify staff review in desktop and touch Chromium
        run: timeout 150s node tests/web_staff_demo.mjs
      - name: Verify bow review in desktop and touch Chromium
        run: node tests/web_bow_demo.mjs
      - name: Verify actual Web persistence in Chromium
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s node tests/web_save_browser.mjs 2>&1 | tee /tmp/web-save-browser.log
          grep '^WEB_SAVE_RESULT: [0-9]* checks, 0 failures$' /tmp/web-save-browser.log
      - name: Verify sword review in desktop and touch Chromium
        run: node tests/web_sword_demo.mjs
      - name: Save Web build (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: andar-1-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Publish tested Web build to Vercel
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download validated Godot Web build
        uses: actions/download-artifact@v4
        with:
          name: andar-1-web
          path: web
      - name: Set up Node.js for Vercel CLI
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish to existing Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_6XRzZ5HN4AOw2hWyIpf8McMU
          VERCEL_PROJECT_ID: prj_gYKlx91MiswTmwj2PLiN5liQD0B7
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo '::error title=Vercel token missing::Add the VERCEL_TOKEN secret in GitHub Actions settings before running the deployment.'
            exit 1
          fi
          test -s web/index.html
          test -s web/index.wasm
          test -s web/index.pck
          mkdir -p web/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > web/.vercel/project.json
          cd web
          npx --yes vercel@62.7.0 deploy --prod --yes

  preview:
    name: Preview proposed Godot Web changes
    needs: web
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feat/andar1-v020-primeiro-passe' || github.head_ref == 'feat/progressao-etapa2')) ||
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/feat/andar1-v020-primeiro-passe' || github.ref == 'refs/heads/feat/progressao-etapa2'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: grande-arvore-rpg-fixed-test-preview
      cancel-in-progress: true
    steps:
      - name: Download tested Web export
        uses: actions/download-artifact@v4
        with:
          name: andar-1-web
          path: web
      - name: Checkout reviewed Preview helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: source
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish preview
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_6XRzZ5HN4AOw2hWyIpf8McMU
          VERCEL_PROJECT_ID: prj_gYKlx91MiswTmwj2PLiN5liQD0B7
          TEST_ALIAS: grande-arvore-rpg-teste.vercel.app
          PREVIEW_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo '::error title=Vercel token missing::Create the VERCEL_TOKEN repository secret.'
            exit 1
          fi
          test -s web/index.html && test -s web/index.wasm && test -s web/index.pck
          mkdir -p web/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > web/.vercel/project.json
          cd web
          cp ../source/tools/preview-vercel.json vercel.json
          npx --yes vercel@62.7.0 deploy --yes --non-interactive --meta "githubCommitSha=$PREVIEW_COMMIT_SHA" --meta "githubCommitRef=$PREVIEW_BRANCH" > /tmp/grande-arvore-deploy.json
          preview_url="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync("/tmp/grande-arvore-deploy.json", "utf8"));
            if (result.status !== "ok" || result.deployment.readyState !== "READY" || result.deployment.target === "production") process.exit(1);
            console.log(result.deployment.url);
          ')"
          echo "Preview URL: $preview_url"
          echo "## Preview Android / desktop" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f ../source/tools/skill1-review.json ]]; then
            # Skills 1 are pending visual review: never call the fixed alias publisher.
            PREVIEW_URL="$preview_url" node ../source/tools/verify-skill1-preview.mjs
          elif [[ -f ../source/tools/melee-review.json ]]; then
            melee_status="$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const p=JSON.parse(readFileSync("../source/tools/melee-review.json","utf8"));
              if(p.entry!=="amostra-machado/index.html" || JSON.stringify(p.additionalEntries)!==JSON.stringify(["amostra-lanca/index.html"])) process.exit(1);
              if(p.status==="approved-in-game" && p.fixedTestAlias===true) console.log("approved");
              else if(p.status==="awaiting-visual-approval" && p.fixedTestAlias===false) console.log("pending");
              else process.exit(1);
            ')"
            if [[ "$melee_status" == "approved" ]]; then
              PREVIEW_URL="$preview_url" node ../source/tools/publish-test-alias.mjs
              node ../source/tools/verify-test-build.mjs
            else
              PREVIEW_URL="$preview_url" node ../source/tools/verify-melee-preview.mjs
            fi
          elif [[ -f ../source/tools/staff-review.json ]]; then
            staff_status="$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const p=JSON.parse(readFileSync("../source/tools/staff-review.json","utf8"));
              if(p.entry!=="amostra-cajado/index.html") process.exit(1);
              if(p.status==="approved-in-game" && p.fixedTestAlias===true) console.log("approved");
              else if(p.status==="awaiting-visual-approval" && p.fixedTestAlias===false) console.log("pending");
              else process.exit(1);
            ')"
            if [[ "$staff_status" == "approved" ]]; then
              PREVIEW_URL="$preview_url" node ../source/tools/publish-test-alias.mjs
              node ../source/tools/verify-test-build.mjs
            else
              PREVIEW_URL="$preview_url" node ../source/tools/verify-staff-preview.mjs
            fi
          elif [[ -f ../source/tools/bow-review.json ]]; then
            bow_status="$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const p=JSON.parse(readFileSync("../source/tools/bow-review.json","utf8"));
              if(p.entry!=="amostra-arco/index.html") process.exit(1);
              if(p.status==="approved-in-game" && p.fixedTestAlias===true) console.log("approved");
              else if(p.status==="awaiting-visual-approval" && p.fixedTestAlias===false) console.log("pending");
              else process.exit(1);
            ')"
            if [[ "$bow_status" == "approved" ]]; then
              PREVIEW_URL="$preview_url" node ../source/tools/publish-test-alias.mjs
              node ../source/tools/verify-test-build.mjs
            else
              PREVIEW_URL="$preview_url" node ../source/tools/verify-bow-preview.mjs
            fi
          else
            review_status="$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const p = JSON.parse(readFileSync("../source/tools/sword-review.json", "utf8"));
              if (p.entry !== "amostra-espada/index.html") process.exit(1);
              if (p.status === "awaiting-visual-approval" && p.fixedTestAlias === false) console.log("pending");
              else if (p.status === "approved-in-game" && p.fixedTestAlias === true) console.log("approved");
              else process.exit(1);
            ')"
            if [[ "$review_status" == "pending" ]]; then
              # Fail closed: malformed/missing exported review data aborts; no alias call.
              PREVIEW_URL="$preview_url" node ../source/tools/verify-sword-preview.mjs
              echo "[Espada V1 — demonstração isolada]($preview_url/amostra-espada/index.html)" >> "$GITHUB_STEP_SUMMARY"
              echo "TESTE fixo preservado; aguardando aprovação visual." >> "$GITHUB_STEP_SUMMARY"
            else
              PREVIEW_URL="$preview_url" node ../source/tools/publish-test-alias.mjs
              node ../source/tools/verify-test-build.mjs
              echo "[TESTE — endereço fixo](https://$TEST_ALIAS)" >> "$GITHUB_STEP_SUMMARY"
              echo "[Build desta execução]($preview_url)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi


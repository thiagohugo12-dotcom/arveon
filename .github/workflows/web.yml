name: Web build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install matching engine and export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"
          ln -s "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /tmp/godot-bin/godot
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz 'templates/web*' -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/web* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/import.log; then exit 1; fi
      - name: Gameplay contract tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee /tmp/tests.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/tests.log; then exit 1; fi
      - name: Export Web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/export.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/export.log; then exit 1; fi
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
      - name: Save Web build (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: andar-1-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Publish tested Web build to Vercel
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download validated Godot Web build
        uses: actions/download-artifact@v4
        with:
          name: andar-1-web
          path: web
      - name: Set up Node.js for Vercel CLI
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish to existing Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_6XRzZ5HN4AOw2hWyIpf8McMU
          VERCEL_PROJECT_ID: prj_gYKlx91MiswTmwj2PLiN5liQD0B7
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo '::error title=Vercel token missing::Add the VERCEL_TOKEN secret in GitHub Actions settings before running the deployment.'
            exit 1
          fi
          test -s web/index.html
          test -s web/index.wasm
          test -s web/index.pck
          mkdir -p web/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > web/.vercel/project.json
          cd web
          npx --yes vercel@62.7.0 deploy --prod --yes --token "$VERCEL_TOKEN"

  preview:
    name: Preview proposed Godot Web changes
    needs: web
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download tested Web export
        uses: actions/download-artifact@v4
        with:
          name: andar-1-web
          path: web
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish preview
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_6XRzZ5HN4AOw2hWyIpf8McMU
          VERCEL_PROJECT_ID: prj_gYKlx91MiswTmwj2PLiN5liQD0B7
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo '::error title=Vercel token missing::Create the VERCEL_TOKEN repository secret.'
            exit 1
          fi
          test -s web/index.html && test -s web/index.wasm && test -s web/index.pck
          mkdir -p web/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > web/.vercel/project.json
          cd web
          preview_url="$(npx --yes vercel@62.7.0 deploy --yes --token "$VERCEL_TOKEN")"
          echo "Preview URL: $preview_url"
          echo "## Preview Android / desktop" >> "$GITHUB_STEP_SUMMARY"
          echo "[Abrir protótipo experimental]($preview_url)" >> "$GITHUB_STEP_SUMMARY"
